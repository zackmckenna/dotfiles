
# Ensure Homebrew binaries are available in popups and run-shell commands
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# Session persistence - keep sessions alive when terminal closes
set -g destroy-unattached off
set -g exit-empty off

# Change prefix from C-b to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Use vi mode in copy mode
setw -g mode-keys vi

# Enable clipboard integration (critical for macOS)
set -g set-clipboard on

# Fix bracketed paste mode for Alacritty (prevents intermittent paste issues)
bind-key ] paste-buffer -p

# Better colors and visuals
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# WezTerm specific overrides for proper rendering
set -ga terminal-overrides ",wezterm:Tc:RGB:Ms=\\E]52;%p1%s;%p2%s\\007"
set -ga terminal-overrides ",wezterm:cud=\\E[%p1%dB:cuu=\\E[%p1%dA"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Fix for unfocused pane rendering - disables problematic terminal capability
# Commented out as it may cause rendering issues
# set -as terminal-overrides ',*:indn@'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Faster key repetition
set -s escape-time 0

# Easy config reload with C-a r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
# Respawn a dead pane (after tmux crash recovery)
bind R respawn-pane -k

# Better pane splitting with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Fuzzy session switcher (C-a C-s)
bind C-s display-popup -E -w 80% -h 80% "\
  tmux list-sessions -F '#S' | \
  fzf --reverse --header 'Select session:' --preview 'tmux list-windows -t {}' | \
  xargs tmux switch-client -t"

# Fuzzy search sessions (C-a s - lowercase for speed)
bind s display-popup -E -w 80% -h 80% "\
  tmux list-sessions -F '#S' | \
  fzf --reverse --header 'Search sessions:' --preview 'tmux list-windows -t {}' | \
  xargs tmux switch-client -t"

# Fuzzy search sessions (C-a e - alternative binding)
bind e display-popup -E -w 80% -h 80% "\
  tmux list-sessions -F '#S' | \
  fzf --reverse --header 'Search sessions:' --preview 'tmux list-windows -t {}' | \
  xargs tmux switch-client -t"

# Traditional session list (C-a S - capital S)
bind S choose-tree -Zs

# Resize panes with Shift + arrows
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode keybindings (vi-style) - handled by tmux-yank plugin
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi s command-prompt -p "search:" "send -X search-forward \"%%%\""
bind -T copy-mode-vi S command-prompt -p "search backward:" "send -X search-backward \"%%%\""
# Note: y, Enter, and mouse copy are handled by tmux-yank plugin below

# Paste with prefix + p
bind p paste-buffer

# Claude Code image paste support (Ctrl+V saves clipboard image to temp file and pastes path)
bind -n C-v run-shell -b "~/.local/bin/clip2path | tmux load-buffer -; tmux paste-buffer"

# Enable mouse support for copying
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# LazyGit bindings
# Open LazyGit in a popup if supported, else split-pane fallback
bind-key g run-shell 'tmux display-popup -E -d "#{pane_current_path}" lazygit 2>/dev/null || tmux split-window -v -c "#{pane_current_path}" lazygit'
bind-key G split-window -v -c '#{pane_current_path}' 'lazygit'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect settings - save/restore session state
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'ssh lazygit nvim vim'

# Continuum settings - auto-save and auto-restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# tmux-yank configuration for macOS
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe'
set -g @override_copy_command 'pbcopy'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# Fix for pane rendering issues
set -g focus-events on
set -g status-interval 1
setw -g monitor-activity on
set -g visual-activity off
# Disable aggressive-resize for WezTerm compatibility
setw -g aggressive-resize off

# CRITICAL: Force pane content updates even when not focused
set -g remain-on-exit off
set -g allow-passthrough on

# Force redraw more frequently
set -g display-time 4000
set -g repeat-time 500

# Fix terminal overrides for better rendering
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# Ensure panes update content automatically (CRITICAL FIX)
set-hook -g pane-focus-in "refresh-client"
set-hook -g window-pane-changed "refresh-client"

# New session from project directory (prefix + n)
# Fuzzy search common project directories and create session named after folder
bind n display-popup -E -w 80% -h 80% "\
  fd -t d -d 1 . ~/Developer/work ~/Developer ~/work ~/projects ~/ 2>/dev/null | \
  fzf --reverse --header 'New session from project:' --preview 'ls -la {}' | \
  xargs -I {} sh -c 'tmux new-session -d -s \$(basename {}) -c {} && tmux switch-client -t \$(basename {})'"

### --- Pane Management ---
# Break pane to its own window (prefix + b)
bind b break-pane

# Join pane from another window (prefix + J - prompts for source)
bind J command-prompt -p "join pane from:" "join-pane -s '%%'"

# Swap panes
bind > swap-pane -D  # Swap with next pane
bind < swap-pane -U  # Swap with previous pane

# Synchronize panes toggle (send input to all panes)
bind y setw synchronize-panes \; display "Sync #{?pane_synchronized,ON,OFF}"

# Cycle through layouts (even-horizontal, even-vertical, main-horizontal, etc.)
bind Space next-layout

# Quick pane kill (no confirmation)
bind x kill-pane
bind X kill-window

### --- Htop/System Monitor ---
bind t display-popup -E -w 90% -h 90% "htop 2>/dev/null || top"
