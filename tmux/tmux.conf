
# Change prefix from C-b to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Better colors and visuals
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Faster key repetition
set -s escape-time 0

# Easy config reload with C-a r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Better pane splitting with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift + arrows
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# LazyGit bindings
# Open LazyGit in a popup if supported, else split-pane fallback
bind-key g run-shell 'tmux display-popup -E -d "#{pane_current_path}" lazygit 2>/dev/null || tmux split-window -v -c "#{pane_current_path}" lazygit'
bind-key G split-window -v -c '#{pane_current_path}' 'lazygit'
